<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacman</title>
  <link rel="stylesheet" href="pacman.css" />
</head>
<body>

  <div class="game-wrapper">
    <div class="track" id="track">

      <div class="dots" id="dots"></div>

      <div id="pacman" class="pacman">
        <div class="eye"></div>
        <div class="mouth"></div>
      </div>

      <div id="ghost" class="ghost"></div>

      <button id="clickBox" class="click-box">Start</button>

    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="retro.mp3" type="audio/mpeg" />
  </audio>

  <script src="pacman.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacman</title>

  <link rel="stylesheet" href="pacman.css">
</head>
<body>

  <div class="game-wrapper">
    <div class="track" id="track">

      <div class="dots" id="dots"></div>

      <!-- PACMAN -->
      <div id="pacman" class="pacman">
        <div class="mouth"></div>
        <div class="eye"></div>
      </div>

      <!-- GHOST -->
      <div id="ghost" class="ghost"></div>

      <!-- START -->
      <button id="clickBox" class="click-box">
        START
      </button>

    </div>
  </div>

  <!-- AUDIO -->
  <audio id="bgMusic" loop>
    <source src="retro.mp3" type="audio/mpeg">
  </audio>

  <script src="pacman.js"></script>
</body>
</html>

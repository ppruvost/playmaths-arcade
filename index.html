    <div class="dots" id="dots"></div>
    <div class="ghost" id="ghost"></div>
    <div class="pacman" id="pacman"></div>
    <div class="click-cube" id="clickCube">CLIC</div>

  <div class="main">

    <!-- MENU -->
    <div class="menu">

      <div class="section">
        <div class="title">• Seconde BAC Pro</div>
        <ul>
          <li>🔎 <a href="seconde_math.html">Mathématiques</a></li>
          <li>🔎 <a href="seconde_sciences.html">Sciences</a></li>
        </ul>
      </div>

      <div class="section">
        <div class="title">• Première BAC Pro</div>
        <ul>
          <li>🔎 <a href="premiere_math.html">Mathématiques</a></li>
          <li>🔎 <a href="premiere_sciences.html">Sciences</a></li>
        </ul>
      </div>

      <div class="section">
        <div class="title">• Terminale BAC Pro</div>
        <ul>
          <li>🔎 <a href="terminale_math.html">Mathématiques</a></li>
          <li>🔎 <a href="terminale_sciences.html">Sciences</a></li>
        </ul>
      </div>

    </div>

    <!-- TABLEAU DES SCORES -->
    <div class="leaderboard">
      <table>
        <thead>
          <tr>
            <th>Rang</th>
            <th>Prénom</th>
            <th>Date</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="scoreTable"></tbody>
</html>

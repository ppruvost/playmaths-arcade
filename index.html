<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayMaths Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUDIO -->
<audio id="bgMusic" loop>
  <source src="retro.mp3" type="audio/mpeg">
  Votre navigateur ne supporte pas l'audio.
</audio>

<div class="container">

  <h1>🎮 PLAYMATHS ARCADE 🎮</h1>
  <p class="subtitle">Top 10 des meilleurs scores</p>

  <!-- Bouton (caché par défaut) -->
  <button id="startMusic" class="music-btn" style="display:none;">
    🔊 Activer la musique rétro
  </button>

  <div class="leaderboard">
    <table>
      <thead>
        <tr>
          <th>Rang</th>
          <th>Prénom</th>
          <th>Date</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="scoreTable"></tbody>
    </table>
  </div>

  <div class="menu-links">
    <a href="quiz.html">▶ Lancer le Quiz</a>
  </div>

</div>

<script src="scores.js"></script>
<script src="leaderboard.js"></script>

<script>
  const music = document.getElementById("bgMusic");
  const startBtn = document.getElementById("startMusic");

  // Tentative d'autoplay au chargement
  window.addEventListener("load", () => {
    music.play()
      .then(() => {
        console.log("Musique lancée automatiquement");
      })
      .catch(() => {
        console.log("Autoplay bloqué → affichage du bouton");
        startBtn.style.display = "inline-block";
      });
  });

  // Lecture manuelle si autoplay bloqué
  startBtn.addEventListener("click", () => {
    music.play();
    startBtn.style.display = "none";
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sciences - Terminale Pro</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    /* IFRAME */
    .frame-container {
      max-width: 1100px;
      margin: 20px auto;
      height: calc(100vh - 260px);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56,189,248,0.3);
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* TABLE */
    .table-container {
      max-width: 1100px;
      margin: auto;
      background: #1e293b;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    th {
      background: #334155;
      color: #38bdf8;
    }

    tr {
      transition: 0.2s;
    }

    tr:hover {
      background: #334155;
      cursor: pointer;
      transform: scale(1.01);
    }

    /* TAGS */
    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .niveau { background: #475569; color: white; }
    .cap1 { background: #0ea5e9; }
    .cap2 { background: #22c55e; }
    .cap3 { background: #ef4444; }
    .cap4 { background: #eab308; color: black; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { padding: 10px; }

      .frame-container {
        height: 300px;
      }

      table {
        min-width: 600px;
      }
    }
  </style>
</head>

<body>

<h1>🎮 Sciences - TERMINALE PRO 🎮</h1>

<!-- IFRAME -->
<div class="frame-container">
  <iframe id="contentFrame" src=""></iframe>
</div>

<!-- TABLE -->
<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Nom</th>
        <th>Accès</th>
        <th>Niveau</th>
        <th>Capacité</th>
      </tr>
    </thead>
    <tbody>

      <tr onclick="loadPage('https://ppruvost.github.io/meca02/')">
        <td>Développement prochainement en cours</td>
        <td>▶ Ouvrir</td>
        <td><span class="tag niveau">Niveau 01</span></td>
        <td><span class="tag cap1">Développement prochainement en cours</span></td>
      </tr>

 

      

    </tbody>
  </table>
</div>

<script>
  function loadPage(url) {
    document.getElementById("contentFrame").src = url;
  }
</script>

</body>
</html>
